# ============================================================
# Nginx 反代配置（Caddy 的替代方案，适合已有 Nginx 的机器）
# 安装路径：/etc/nginx/conf.d/kb-stack.conf（或 sites-enabled 软链）
# 证书获取：certbot --nginx -d kb.example.com -d rag.example.com
# 注意：SiYuan 文档明确要求保留 Host 头与 Upgrade/Connection 透传
# ============================================================

# 上游定义（Docker 网络内直连容器名；若 Nginx 装在宿主机，
# 需将 siyuan/anythingllm 换成 127.0.0.1:6806 / 127.0.0.1:3001，
# 因为 compose 里端口只绑定到了回环地址）
upstream siyuan_upstream {
    server siyuan:6806;
    keepalive 16;
}
upstream anythingllm_upstream {
    server anythingllm:3001;
    keepalive 16;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name kb.example.com rag.example.com;
    return 301 https://$host$request_uri;
}

# ---------- SiYuan ----------
server {
    listen 443 ssl;
    http2 on;
    server_name kb.example.com;

    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    # SiYuan 单文档不大，但保留上传空间
    client_max_body_size 256m;

    # WebSocket（内核级内容同步需要）
    location / {
        proxy_pass http://siyuan_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 笔记接口多为长连接轮询，放宽读超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------- AnythingLLM ----------
server {
    listen 443 ssl;
    http2 on;
    server_name rag.example.com;

    ssl_certificate     /etc/letsencrypt/live/rag.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rag.example.com/privkey.pem;

    # 上传大型源码包/文档集
    client_max_body_size 512m;

    location / {
        proxy_pass http://anythingllm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;    # 流式 SSE/WS
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 本地模型生成较慢，10 分钟读超时防止流被掐断
        proxy_read_timeout 600s;
        proxy_buffering off;                        # SSE 必须关缓冲，否则流式输出卡顿
    }
}
